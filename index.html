<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AlignDocs</title>
  <script type="importmap">
  {
    "imports": {
      "genlayer-js": "https://esm.sh/genlayer-js@0.24.0"
    }
  }
  </script>
  <style>
    body { font-family: sans-serif; max-width: 760px; margin: 32px auto; padding: 0 16px; }
    input, button { font: inherit; width: 100%; box-sizing: border-box; margin: 6px 0 12px; padding: 8px; }
    button { cursor: pointer; }
    pre { white-space: pre-wrap; background: #f6f6f6; padding: 10px; }
    .err { color: #c00; }
  </style>
</head>
<body>
  <h1>AlignDocs</h1>
  <p>Studio Next (chain 61997). Submit URLs, resolve a case, read the on-chain verdict here.</p>
  <p>Contract: <code>0x3681aC016717f269D1bF1D6347816D027A6148FC</code></p>
  <button id="connect">Connect wallet</button>
  <p id="status"></p>
  <h2>Submit</h2>
  <label>article_url</label>
  <input id="article" value="https://raw.githubusercontent.com/bearbaba/AlignDocs/main/samples/contradicts.md" />
  <label>docs_url</label>
  <input id="docs" value="https://docs.genlayer.com/understand-genlayer-protocol/what-is-genlayer" />
  <button id="submitBtn">submit()</button>
  <h2>Resolve + verdict</h2>
  <label>case id</label>
  <input id="caseId" value="0" />
  <button id="resolveBtn">resolve(id)</button>
  <button id="readBtn">get_case(id)</button>
  <button id="listBtn">list_resolved()</button>
  <pre id="out"></pre>
  <script type="module">
    import { createClient } from "genlayer-js";

    const CONTRACT = "0x3681aC016717f269D1bF1D6347816D027A6148FC";
    const CHAIN = {
      id: 61997,
      name: "GenLayer Studio Next",
      rpcUrls: { default: { http: ["https://studio-next.genlayer.com/api"] } },
      nativeCurrency: { name: "GEN", symbol: "GEN", decimals: 18 },
    };

    let client;
    const out = document.getElementById("out");
    const status = document.getElementById("status");
    const log = (x) => { out.textContent = typeof x === "string" ? x : JSON.stringify(x, null, 2); };

    async function ready() {
      if (!window.ethereum) throw new Error("Install MetaMask in this browser");
      const [account] = await window.ethereum.request({ method: "eth_requestAccounts" });
      try {
        await window.ethereum.request({
          method: "wallet_switchEthereumChain",
          params: [{ chainId: "0xF20D" }],
        });
      } catch (e) {
        if (e.code === 4902) {
          await window.ethereum.request({
            method: "wallet_addEthereumChain",
            params: [{
              chainId: "0xF20D",
              chainName: "GenLayer Studio Next",
              nativeCurrency: { name: "GEN", symbol: "GEN", decimals: 18 },
              rpcUrls: ["https://studio-next.genlayer.com/api"],
            }],
          });
        } else {
          throw e;
        }
      }
      client = createClient({ chain: CHAIN, account, provider: window.ethereum });
      status.textContent = "Connected " + account + " @ 61997";
      return client;
    }

    document.getElementById("connect").onclick = () =>
      ready().catch((e) => { status.className = "err"; status.textContent = e.message || String(e); });

    document.getElementById("submitBtn").onclick = async () => {
      try {
        const c = client || await ready();
        const write = {
          address: CONTRACT,
          functionName: "submit",
          args: [
            document.getElementById("article").value.trim(),
            document.getElementById("docs").value.trim(),
          ],
        };
        let payload = write;
        try {
          const estimate = await c.estimateTransactionFeesForWrite(write);
          payload = { ...write, fees: { distribution: estimate.distribution, feeValue: estimate.feeValue } };
        } catch (_) {}
        const txId = await c.writeContract(payload);
        await c.waitForFinalization({ hash: txId }).catch(() => {});
        log({ submitted: txId });
      } catch (e) { log(String(e)); }
    };

    document.getElementById("resolveBtn").onclick = async () => {
      try {
        const c = client || await ready();
        const write = {
          address: CONTRACT,
          functionName: "resolve",
          args: [document.getElementById("caseId").value.trim()],
        };
        let payload = write;
        try {
          const estimate = await c.estimateTransactionFeesForWrite(write);
          payload = { ...write, fees: { distribution: estimate.distribution, feeValue: estimate.feeValue } };
        } catch (_) {}
        const txId = await c.writeContract(payload);
        await c.waitForFinalization({ hash: txId }).catch(() => {});
        const verdict = await c.readContract({
          address: CONTRACT,
          functionName: "get_case",
          args: [document.getElementById("caseId").value.trim()],
        });
        log({ resolved: txId, verdict });
      } catch (e) { log(String(e)); }
    };

    document.getElementById("readBtn").onclick = async () => {
      try {
        const c = client || await ready();
        log(await c.readContract({
          address: CONTRACT,
          functionName: "get_case",
          args: [document.getElementById("caseId").value.trim()],
        }));
      } catch (e) { log(String(e)); }
    };

    document.getElementById("listBtn").onclick = async () => {
      try {
        const c = client || await ready();
        log(await c.readContract({
          address: CONTRACT,
          functionName: "list_resolved",
          args: [],
        }));
      } catch (e) { log(String(e)); }
    };
  </script>
</body>
</html>
